<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Admin Login — NapsterLegal</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/output.css' %}"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet"/>
  <style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'DM Sans',sans-serif;background:#060A12;color:#F0F4FF;}</style>
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;
             background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(239,68,68,.12) 0%,transparent 60%),#060A12;">
  <div style="width:100%;max-width:360px;padding:1.25rem;">
    <div style="text-align:center;margin-bottom:1.75rem;">
      <div style="width:50px;height:50px;border-radius:13px;margin:0 auto .875rem;
                  background:linear-gradient(135deg,#EF4444,#DC2626);
                  display:flex;align-items:center;justify-content:center;
                  box-shadow:0 4px 18px rgba(239,68,68,.4);">
        <svg width="26" height="26" fill="white" viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
      </div>
      <h1 style="font-family:'Sora',sans-serif;font-size:1.375rem;font-weight:800;color:#F0F4FF;margin-bottom:.25rem;">
        Admin Control Panel</h1>
      <p style="color:#4A5568;font-size:.8125rem;">Restricted — Staff & Superusers Only</p>
    </div>
    <div style="background:rgba(13,20,32,.95);border:1px solid rgba(239,68,68,.12);
                border-radius:18px;padding:1.75rem;backdrop-filter:blur(20px);">
      {% if error %}
      <div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);
                  border-radius:8px;padding:.625rem .875rem;margin-bottom:1rem;
                  color:#FCA5A5;font-size:.8125rem;">{{ error }}</div>
      {% endif %}
      <form method="POST" style="display:flex;flex-direction:column;gap:.875rem;">
        {% csrf_token %}
        <div>
          <label style="display:block;font-size:.75rem;font-weight:600;color:#4A5568;margin-bottom:.3rem;">Username</label>
          <input type="text" name="username" required autofocus
                 style="width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
                        border-radius:9px;padding:.625rem .875rem;color:#F0F4FF;font-size:.875rem;outline:none;"
                 onfocus="this.style.borderColor='#EF4444'" onblur="this.style.borderColor='rgba(255,255,255,.1)'"/>
        </div>
        <div>
          <label style="display:block;font-size:.75rem;font-weight:600;color:#4A5568;margin-bottom:.3rem;">Password</label>
          <input type="password" name="password" required
                 style="width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
                        border-radius:9px;padding:.625rem .875rem;color:#F0F4FF;font-size:.875rem;outline:none;"
                 onfocus="this.style.borderColor='#EF4444'" onblur="this.style.borderColor='rgba(255,255,255,.1)'"/>
        </div>
        <button type="submit"
                style="padding:.75rem;border-radius:10px;border:none;cursor:pointer;
                       background:linear-gradient(135deg,#EF4444,#DC2626);
                       color:white;font-size:.9375rem;font-weight:700;margin-top:.25rem;
                       box-shadow:0 4px 14px rgba(239,68,68,.35);transition:all .2s;"
                onmouseover="this.style.transform='translateY(-1px)'"
                onmouseout="this.style.transform='translateY(0)'">
          Access Control Panel →
        </button>
      </form>
    </div>
    <p style="text-align:center;margin-top:1rem;font-size:.75rem;color:#4A5568;">
      Not an admin?
      <a href="/" style="color:#64748B;" onmouseover="this.style.color='#94A3B8'" onmouseout="this.style.color='#64748B'">
        Go to NapsterLegal →</a>
    </p>
  </div>
</body>
</html>
