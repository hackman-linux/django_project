<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — NapsterLegal Control</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/output.css' %}"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
</head>

<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
             background:#080C14;font-family:'DM Sans',sans-serif;">

  <!-- Background mesh -->
  <div style="position:fixed;inset:0;pointer-events:none;
              background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(239,68,68,0.1) 0%,transparent 60%),
                          radial-gradient(ellipse 60% 40% at 80% 110%,rgba(245,158,11,0.08) 0%,transparent 60%);"></div>

  <div style="width:100%;max-width:380px;padding:1.25rem;position:relative;z-index:1;">
    <!-- Logo -->
    <div style="text-align:center;margin-bottom:2rem;">
      <div style="width:52px;height:52px;border-radius:14px;margin:0 auto 1rem;
                  background:linear-gradient(135deg,#EF4444,#DC2626);
                  display:flex;align-items:center;justify-content:center;
                  box-shadow:0 4px 20px rgba(239,68,68,0.35);">
        <svg width="28" height="28" fill="white" viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
        </svg>
      </div>
      <h1 style="font-family:'Sora',sans-serif;font-size:1.5rem;font-weight:800;color:#F0F4FF;margin:0 0 0.25rem;">
        Admin Control
      </h1>
      <p style="color:#4A5568;font-size:0.875rem;">NapsterLegal — Restricted Access</p>
    </div>

    <!-- Login card -->
    <div style="background:rgba(20,30,51,0.9);border:1px solid rgba(239,68,68,0.15);
                border-radius:20px;padding:2rem;backdrop-filter:blur(20px);">

      {% if error %}
      <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);
                  border-radius:10px;padding:0.75rem 1rem;margin-bottom:1.25rem;
                  color:#FCA5A5;font-size:0.875rem;">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" style="display:flex;flex-direction:column;gap:1rem;">
        {% csrf_token %}
        <div>
          <label style="display:block;font-size:0.8125rem;font-weight:600;color:#94A3B8;margin-bottom:0.375rem;">
            Admin Username
          </label>
          <input type="text" name="username" required autofocus
                 style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
                        border-radius:10px;padding:0.75rem 1rem;color:#F0F4FF;font-size:0.9rem;
                        outline:none;box-sizing:border-box;transition:border-color 0.15s;"
                 onfocus="this.style.borderColor='#EF4444'"
                 onblur="this.style.borderColor='rgba(255,255,255,0.1)'"/>
        </div>
        <div>
          <label style="display:block;font-size:0.8125rem;font-weight:600;color:#94A3B8;margin-bottom:0.375rem;">
            Password
          </label>
          <input type="password" name="password" required
                 style="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
                        border-radius:10px;padding:0.75rem 1rem;color:#F0F4FF;font-size:0.9rem;
                        outline:none;box-sizing:border-box;transition:border-color 0.15s;"
                 onfocus="this.style.borderColor='#EF4444'"
                 onblur="this.style.borderColor='rgba(255,255,255,0.1)'"/>
        </div>
        <button type="submit"
                style="width:100%;padding:0.875rem;border-radius:12px;border:none;cursor:pointer;
                       background:linear-gradient(135deg,#EF4444,#DC2626);
                       color:white;font-size:0.9375rem;font-weight:700;
                       box-shadow:0 4px 14px rgba(239,68,68,0.35);transition:all 0.2s;margin-top:0.25rem;"
                onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 6px 20px rgba(239,68,68,0.5)'"
                onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 14px rgba(239,68,68,0.35)'">
          Access Control Panel
        </button>
      </form>
    </div>

    <p style="text-align:center;margin-top:1.25rem;font-size:0.8125rem;color:#4A5568;">
      Not an admin?
      <a href="/" style="color:#94A3B8;text-decoration:none;"
         onmouseover="this.style.color='#F0F4FF'"
         onmouseout="this.style.color='#94A3B8'">Go to NapsterLegal →</a>
    </p>
  </div>
</body>
</html>
