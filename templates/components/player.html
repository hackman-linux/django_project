<!-- Persistent bottom audio player -->
<div id="audio-player"
     x-data="audioPlayer()"
     x-show="currentTrack !== null"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-full"
     x-transition:enter-end="opacity-100 translate-y-0"
     class="fixed bottom-0 left-0 right-0 z-50 bg-darker/95 backdrop-blur-xl border-t border-white/10 px-4 py-3">

  <div class="max-w-7xl mx-auto flex items-center gap-4">

    <!-- Track info -->
    <div class="flex items-center gap-3 w-48 min-w-0">
      <div class="w-10 h-10 bg-gradient-to-br from-primary to-accent rounded-lg flex-shrink-0 overflow-hidden">
        <img :src="currentTrack ? currentTrack.cover : ''" class="w-full h-full object-cover"
             x-show="currentTrack && currentTrack.cover"/>
        <svg x-show="!currentTrack || !currentTrack.cover"
             class="w-6 h-6 text-white m-2" fill="currentColor" viewBox="0 0 24 24">
          <path d="M9 18V5l12-2v13M9 18c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/>
        </svg>
      </div>
      <div class="min-w-0">
        <p class="text-white text-sm font-medium truncate" x-text="currentTrack ? currentTrack.title : ''"></p>
        <p class="text-muted text-xs truncate" x-text="currentTrack ? currentTrack.artist : ''"></p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex-1 flex flex-col items-center gap-1">
      <div class="flex items-center gap-4">
        <!-- Shuffle -->
        <button @click="toggleShuffle()"
                :class="shuffle ? 'text-accent' : 'text-muted hover:text-white'"
                class="transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4h5l2 2H4m16 0h-5l-2 2h5M4 20h5l2-2H4m16 0h-5l-2-2h5M7 12h10"/>
          </svg>
        </button>
        <!-- Previous -->
        <button @click="previous()" class="text-muted hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>
        <!-- Play/Pause -->
        <button @click="togglePlay()"
                class="w-10 h-10 bg-white rounded-full flex items-center justify-center hover:scale-105 active:scale-95 transition-transform shadow-lg">
          <svg x-show="!playing" class="w-5 h-5 text-dark ml-0.5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg x-show="playing" class="w-5 h-5 text-dark" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>
        <!-- Next -->
        <button @click="next()" class="text-muted hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 18l8.5-6L6 6v12zm2.5-6l5.5-4v8l-5.5-4zM16 6h2v12h-2z"/>
          </svg>
        </button>
        <!-- Repeat -->
        <button @click="toggleRepeat()"
                :class="repeat ? 'text-accent' : 'text-muted hover:text-white'"
                class="transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
      </div>

      <!-- Progress bar -->
      <div class="flex items-center gap-2 w-full max-w-lg">
        <span class="text-muted text-xs w-8 text-right" x-text="formatTime(currentTime)">0:00</span>
        <div class="flex-1 relative h-1 bg-white/10 rounded-full cursor-pointer"
             @click="seek($event)">
          <div class="h-full bg-gradient-to-r from-primary to-accent rounded-full transition-all"
               :style="`width: ${progress}%`"></div>
          <div class="absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-lg transition-all"
               :style="`left: calc(${progress}% - 6px)`"></div>
        </div>
        <span class="text-muted text-xs w-8" x-text="formatTime(duration)">0:00</span>
      </div>
    </div>

    <!-- Volume & close -->
    <div class="flex items-center gap-3 w-32 justify-end">
      <svg class="w-4 h-4 text-muted flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
      <input type="range" min="0" max="100" x-model="volume"
             @input="setVolume()"
             class="w-20 h-1 bg-white/10 rounded-full appearance-none cursor-pointer accent-primary"/>
      <button @click="currentTrack = null" class="text-muted hover:text-white transition-colors ml-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Hidden audio element -->
  <audio id="main-audio" x-ref="audio"
         @timeupdate="onTimeUpdate()"
         @ended="onEnded()"
         @loadedmetadata="onLoaded()">
  </audio>
</div>
