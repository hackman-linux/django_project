{% load static %}
<div class="card group cursor-pointer"
     onclick="playTrack('{{ track.id }}', '{{ track.title|escapejs }}', '{{ track.artist }}', '{% if track.cover_image %}{{ track.cover_image.url }}{% endif %}', '/api/stream/{{ track.id }}/')">

  <!-- Cover image -->
  <div class="relative aspect-square mb-4 rounded-xl overflow-hidden bg-surface">
    {% if track.cover_image %}
      <img src="{{ track.cover_image.url }}" alt="{{ track.title }}"
           class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"/>
    {% else %}
      <div class="w-full h-full bg-gradient-to-br from-primary/30 to-accent/20 flex items-center justify-center">
        <svg class="w-10 h-10 text-muted" fill="currentColor" viewBox="0 0 24 24">
          <path d="M9 18V5l12-2v13M9 18c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/>
        </svg>
      </div>
    {% endif %}

    <!-- Play button overlay -->
    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
      <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-xl transform scale-90 group-hover:scale-100 transition-transform">
        <svg class="w-6 h-6 text-dark ml-1" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>
    </div>

    <!-- Explicit badge -->
    {% if track.is_explicit %}
    <div class="absolute top-2 right-2">
      <span class="badge bg-red-500/80 text-white text-xs">E</span>
    </div>
    {% endif %}
  </div>

  <!-- Track info -->
  <div class="space-y-1">
    <a href="/track/{{ track.id }}/"
       class="block text-white font-semibold text-sm truncate hover:text-primary transition-colors"
       onclick="event.stopPropagation()">
      {{ track.title }}
    </a>
    <p class="text-muted text-xs truncate">{{ track.artist }}</p>

    <!-- Meta row -->
    <div class="flex items-center justify-between pt-1">
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1 text-muted text-xs">
          <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
          </svg>
          {{ track.play_count }}
        </span>
        <span class="flex items-center gap-1 text-muted text-xs">
          <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          {{ track.like_count }}
        </span>
      </div>
      <span class="text-muted text-xs">{{ track.duration_display }}</span>
    </div>
  </div>
</div>
