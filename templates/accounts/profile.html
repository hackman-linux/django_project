{% extends 'base.html' %}
{% block title %}Profile — {{ profile_user.username }}{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-12 pt-24">
  <div class="card">
    <div class="flex items-center gap-6">
      <div class="w-20 h-20 bg-gradient-to-br from-primary to-accent rounded-full flex items-center justify-center text-3xl font-black text-white">
        {{ profile_user.username|first|upper }}
      </div>
      <div>
        <h1 class="text-2xl font-black text-white">{{ profile_user.username }}</h1>
        <p class="text-muted">{{ profile_user.get_user_type_display }}</p>
        {% if profile_user.is_premium %}
          <span class="badge bg-accent/20 text-accent mt-1">⭐ Premium</span>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
